apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: t9e2e-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: t9e2e-t9e2e-api
      name: http
      visibility: project
      envBindings:
        address: T9E2E_API_URL
  resources:
    - ref: t9e2e-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
